project_id = "gasway"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["gasway://auth/confirm"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
# Supabase has no uppercase + digit preset without also requiring lowercase.
# The app requires uppercase; Auth requires a letter (either case) and a digit.
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "2m"
otp_length = 8

# User JWT is verified online in the function, then order authorization runs in SQL.
[functions.order-route]
verify_jwt = false

# Online Auth validation plus current SQL membership/admin authorization.
[functions.delete-document-owner]
verify_jwt = false
