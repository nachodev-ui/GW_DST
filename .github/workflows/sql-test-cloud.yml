name: Regresiones SQL en Gasway Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gasway-test-database
  cancel-in-progress: false

jobs:
  sql:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gasway-test
    timeout-minutes: 10
    env:
      GASWAY_TEST_PROJECT_REF: ${{ vars.GASWAY_TEST_PROJECT_REF }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require dedicated test credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$GASWAY_TEST_PROJECT_REF" = "xnrueexpwzvxotgwmamj"
      - run: npm run db:test:cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
