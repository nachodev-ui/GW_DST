name: Detección de secretos

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Prove secret detection with a synthetic key
        shell: bash
        run: |
          set -euo pipefail
          sample="sb_secret_$(openssl rand -hex 24)"
          if printf '%s\n' "$sample" | "$RUNNER_TEMP/gitleaks" stdin --config .gitleaks.toml --redact=100 --no-banner; then
            echo 'Secret detector accepted the synthetic key'
            exit 1
          else
            scan_status=$?
            test "$scan_status" -eq 1
          fi
      - name: Scan complete fetched history (redacted)
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner --log-opts="--all" .
